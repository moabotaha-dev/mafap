                ${item.title[currentLang]}
              </h2>
              <p class="text-zinc-400 text-sm leading-relaxed mb-5">
                ${item.summary[currentLang]}
              </p>
            </div>

            <div class="pt-3 border-t border-white/10 flex items-center justify-between text-amberGold text-sm font-bold">
              <span>${btnText}</span>
              <svg class="w-4 h-4 rtl:rotate-180" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
              </svg>
            </div>
          </div>
        </article>
      `).join('');
    }

    function openModal(id) {
      const item = workshopsData.find(w => w.id === id);
      if (!item) return;

      activeId = id;
      const img = document.getElementById('modalImg');
      img.src = item.image;
      img.onerror = () => { img.src = item.fallback; };

      document.getElementById('modalDuration').textContent = item.duration[currentLang];
      document.getElementById('modalPrice').textContent = item.price[currentLang];
      document.getElementById('modalTitle').textContent = item.title[currentLang];
      document.getElementById('modalDesc').textContent = item.details[currentLang];
      document.getElementById('modalBullets').innerHTML = item.bullets[currentLang]
        .map(point => `<li class="flex items-start gap-2"><span class="text-amberGold font-bold">•</span><span>${point}</span></li>`)
        .join('');

      const msg = currentLang === 'ar'
        ? `مرحباً MAFAP، أريد الاستفسار والحجز في: ${item.title.ar} (${item.price.ar})`
        : `Hello MAFAP, I want to inquire and book: ${item.title.en} (${item.price.en})`;

      document.getElementById('modalWhatsappBtn').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;

      const modal = document.getElementById('workshopModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('workshopModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      activeId = null;
    }

    document.getElementById('workshopModal').addEventListener('click', (e) => {
      if (e.target.id === 'workshopModal') closeModal();
    });

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.documentElement.setAttribute('lang', currentLang);
      document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
      document.getElementById('langLabel').textContent = currentLang === 'ar' ? 'EN' : 'عربي';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[currentLang][key]) {
          el.textContent = translations[currentLang][key];
        }
      });

      renderWorkshops();
      if (activeId) openModal(activeId);
    }

    window.addEventListener('DOMContentLoaded', renderWorkshops);
  </script>
</body>
</html>
